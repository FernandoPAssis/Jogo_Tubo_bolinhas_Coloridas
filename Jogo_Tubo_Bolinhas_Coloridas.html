<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogo de Cores e Trilhas - Puzzle</title>
    <!--<script src="https://cdn.tailwindcss.com"></script>-->
    <!--<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>-->

    <script src="cdn_tailwindcss_com.js"></script>
    <script src="confetti_browser_min.js"></script> 
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Aviso para Modo Horizontal -->
    <div id="orientation-warning">
        <div class="rotate-icon">📱🔄</div>
        <h2 class="text-xl font-bold mb-2">Por favor, vire o celular!</h2>
        <p class="text-sm text-indigo-200 max-w-xs">Este jogo foi otimizado para ser jogado com o celular na horizontal.</p>
    </div>


    <!-- Botão de Voltar ao Portal -->
    <div class="portal-nav-container">
        <a href="https://fernandopassis.github.io/Portal-principal/index.html" class="btn-voltar-portal">
            <span class="btn-icon">🏠</span>
            <span class="btn-text">Voltar ao Portals</span>
        </a>
    </div>
    <!-- Cabeçalho -->
    <header class="w-full max-w-lg text-center pt-1 flex justify-between items-center px-2">
        <div>
            <h1 class="text-lg font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-300">
                Puzzle de Cores
            </h1>
            <p class="text-[10px] text-indigo-200">1 tubo livre • Arraste e encadeie as cores!</p>
        </div>
        <button id="soundToggleBtn" onclick="toggleSound()" class="p-1.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/20 text-base transition">
            🔊
        </button>
    </header>

    <!-- Placar e Controles -->
    <div class="w-full max-w-lg flex justify-between items-center my-0.5 px-3 py-1.5 bg-white/10 backdrop-blur-md rounded-xl border border-white/15 text-xs font-semibold">
        <button id="prevBtnHeader" onclick="prevLevel()" class="btn-game text-[11px] bg-indigo-600/80 hover:bg-indigo-600 px-2 py-1 rounded-lg border border-indigo-400/30 transition flex items-center gap-1">
            ⬅ Anterior
        </button>
        <span id="levelDisplay" class="text-cyan-300 font-bold text-xs">Nível 1 de 10</span>
        <button id="nextBtnHeader" onclick="nextLevel()" class="btn-game text-[11px] bg-indigo-600/80 hover:bg-indigo-600 px-2 py-1 rounded-lg border border-indigo-400/30 transition flex items-center gap-1">
            Próximo ➡
        </button>
    </div>

    <!-- Contador de Movimentos -->
    <div class="w-full max-w-lg flex justify-center items-center px-3 mb-0.5 text-[11px] text-indigo-200">
        <span id="movesDisplay">Movimentos: 0</span>
    </div>

    <!-- Tabuleiro do Jogo Responsivo -->
    <main class="w-full flex flex-col items-center justify-center my-auto">
        <div id="board">
            <!-- Colunas geradas dinamicamente -->
        </div>
        <div id="statusMessage" class="h-4 mt-1 text-center text-[11px] font-bold text-cyan-300 transition-all"></div>
    </main>

    <!-- Rodapé de Ações -->
    <footer class="w-full max-w-lg pb-1 flex justify-center gap-3">
        <button onclick="initGame(currentLevel)" class="btn-game px-3 py-1.5 rounded-xl text-xs font-bold tracking-wide flex items-center gap-1.5">
            🔄 Reiniciar Nível
        </button>
    </footer>

    <!-- Tela de Vitória -->
    <div id="victory-screen">
        <div class="victory-title" id="victoryText">BOM TRABALHO!</div>
        <div class="flex flex-col gap-2 w-56 z-102">
            <button id="nextBtnModal" class="btn-game px-3 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-600 shadow-lg" onclick="nextLevel()">Próximo Nível ➡</button>
            <button class="btn-game px-3 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-500 to-orange-500 shadow-lg" onclick="initGame(currentLevel)">🔄 Jogar Novamente</button>
            <button id="prevBtnModal" class="btn-game px-3 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-slate-600 to-slate-700 shadow-lg" onclick="prevLevel()">⬅ Nível Anterior</button>
        </div>
    </div>

    <!-- Indicador Flutuante -->
    <div id="ghostChain" class="ghost-chain hidden"></div>
    <script src="script.js"></script>
</body>
</html>
